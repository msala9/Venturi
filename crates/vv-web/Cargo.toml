[package]
name = "vv-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vv-core = { path = "../vv-core" }
vv-session = { path = "../vv-session" }
vv-media = { path = "../vv-media" }
vv-render = { path = "../vv-render" }
vv-audio = { path = "../vv-audio" }
pollster = "1.0.1"
png = "0.18"
ron = "0.12.2"
rustix = { version = "1", features = ["fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
